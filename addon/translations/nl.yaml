configuration:
  hass_public_url:
    name: Home Assistant-URL voor directe toegang
    description: >-
      Home Assistant-URL die je browser kan bereiken als je Hearth via de
      open poort gebruikt, bijvoorbeeld http://homeassistant.local:8123.
      Gebruik HTTPS als Hearth via HTTPS wordt geserveerd. Ingress gebruikt
      altijd het eigen Home Assistant-adres en negeert deze instelling.
network:
  8099/tcp: 'Optioneel. Poort om Hearth direct te openen, zonder Ingress. Bijvoorbeeld: 5050'
