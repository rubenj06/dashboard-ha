name: Publish add-on

# Pushing a tag addon-<version> publishes the Home Assistant add-on image for
# that version. The version must match addon/config.yaml. Release-triggered
# workflows (docker-publish.yml) are not involved.
on:
  push:
    tags: ['addon-*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # base images pinned by digest (same as knowald/addon-ha-hearth); bump deliberately
        include:
          - arch: amd64
            platform: linux/amd64
            os: ubuntu-24.04
            base: ghcr.io/home-assistant/amd64-base:latest@sha256:2b60b12b34ccd960fda082d223b40dbb2b0bb40af95f12912233b736f27fc47a
          - arch: aarch64
            platform: linux/arm64
            os: ubuntu-24.04-arm
            base: ghcr.io/home-assistant/aarch64-base:latest@sha256:2ac8f73090063ac23e63a1adc144bd1d8aa88f5e5d92c68898102e81046084a4
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Read add-on version and image
        id: addon
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(grep -m1 '^version:' addon/config.yaml | sed -E 's/^version:[[:space:]]*//')
          image=$(grep -m1 '^image:' addon/config.yaml | sed -E 's/^image:[[:space:]]*//; s/\{arch\}/'"$ARCH"'/')
          if [[ "${GITHUB_REF_NAME#addon-}" != "$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match addon/config.yaml version $version." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: addon/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base }}
          labels: |
            io.hass.type=addon
            io.hass.name=Hearth (fork)
            io.hass.version=${{ steps.addon.outputs.version }}
            io.hass.arch=${{ matrix.arch }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ${{ steps.addon.outputs.image }}:${{ steps.addon.outputs.version }}
            ${{ steps.addon.outputs.image }}:latest
          push: true
